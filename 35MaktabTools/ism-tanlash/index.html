<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ism Roulette — 35MaktabTools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14172B;
    --bg-soft: #1C2040;
    --card: #20244A;
    --gold: #F2B705;
    --coral: #FF6B5B;
    --text: #F1EEE4;
    --text-dim: #9BA0C4;
    --border: #33386B;
  }
  *{ box-sizing: border-box; }

  html{
    scrollbar-width: thin;
    scrollbar-color: var(--gold) var(--bg-soft);
  }
  ::-webkit-scrollbar{ width: 10px; height: 10px; }
  ::-webkit-scrollbar-track{ background: var(--bg-soft); }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; border: 2px solid var(--bg-soft); }
  ::-webkit-scrollbar-thumb:hover{ background: var(--gold); }
  ::-webkit-scrollbar-corner{ background: var(--bg-soft); }
  textarea{ scrollbar-width: thin; scrollbar-color: var(--border) var(--bg-soft); }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(242,183,5,0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,107,91,0.10), transparent 45%);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .gate{
    color: var(--text-dim);
    font-size: 14px;
  }
  .wrap{
    width:100%;
    max-width: 480px;
    display:none;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .back-link{
    color: var(--text-dim);
    text-decoration:none;
    font-size: 13px;
  }
  .back-link:hover{ color: var(--gold); }
  .logout-btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 9px;
    cursor: pointer;
  }
  .logout-btn:hover{ border-color: var(--coral); color: var(--text); }

  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 30px;
    margin: 0 0 22px 0;
    line-height: 1.15;
  }
  h1 span{ color: var(--gold); }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
    margin-bottom: 16px;
  }

  .stage{
    height: 120px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius: 14px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .stage-name{
    font-family:'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
  }
  .stage-empty{
    color: var(--text-dim);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
  }
  .stage.winner .stage-name{ color: var(--gold); }

  textarea{
    width:100%;
    min-height: 110px;
    resize: vertical;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    line-height: 1.6;
  }
  textarea:focus{ outline: none; border-color: var(--gold); }
  textarea::placeholder{ color: var(--text-dim); }

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .toggle{
    display:flex;
    align-items:center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .toggle input{ accent-color: var(--coral); width:15px; height:15px; }

  .btn-row{
    display:flex;
    gap: 10px;
    margin-top: 18px;
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 13px 18px;
    cursor: pointer;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  button:active{ transform: scale(0.97); }
  button:disabled{ opacity: 0.4; cursor: not-allowed; }

  .btn-main{ flex: 1; background: var(--gold); color: #14172B; }
  .btn-ghost{ background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn-ghost:hover{ border-color: var(--coral); color: var(--text); }
  .btn-save{ flex:1; background: var(--bg-soft); border: 1px solid var(--gold); color: var(--gold); }
  .btn-save:hover{ background: rgba(242,183,5,0.1); }

  .pool-count{
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 14px;
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background: var(--coral); }

  .sync-status{
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
    min-height: 16px;
  }
  .sync-status.saved{ color: #6FCF97; }
  .sync-status.error{ color: var(--coral); }
</style>
</head>
<body>

<div class="gate" id="gate">Tekshirilmoqda...</div>

<div class="wrap" id="appWrap">
  <div class="topbar">
    <a class="back-link" href="../index.html">&larr; Barcha tool'lar</a>
    <button class="logout-btn" id="logoutBtn">Chiqish</button>
  </div>

  <div class="eyebrow">O'quvchi tanlash</div>
  <h1>Ism <span>Roulette</span></h1>

  <div class="card">
    <div class="stage" id="stage">
      <div class="stage-empty" id="stageEmpty">Ismlarni kiriting va "Tanla" bosing</div>
    </div>

    <textarea id="namesInput" placeholder="Har bir qatorga bitta ism:&#10;Ali&#10;Vali&#10;Guli&#10;Madina"></textarea>

    <div class="meta-row">
      <label class="toggle">
        <input type="checkbox" id="removeAfterPick" checked>
        Tanlangach ro'yxatdan olib tashlash
      </label>
      <span id="countLabel">0 ta ism</span>
    </div>

    <div class="btn-row">
      <button class="btn-save" id="saveBtn">Saqlash</button>
      <button class="btn-main" id="pickBtn">Tanla</button>
      <button class="btn-ghost" id="resetBtn">Qayta yuklash</button>
    </div>

    <div class="sync-status" id="syncStatus"></div>

    <div class="pool-count" id="poolCount" style="display:none;">
      <span class="dot"></span>
      <span id="poolCountText"></span>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth, logout } from "../auth.js";
  import { db, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp }
    from "../firebase-config.js";

  const gate = document.getElementById('gate');
  const appWrap = document.getElementById('appWrap');
  const logoutBtn = document.getElementById('logoutBtn');

  const namesInput = document.getElementById('namesInput');
  const stage = document.getElementById('stage');
  const stageEmpty = document.getElementById('stageEmpty');
  const pickBtn = document.getElementById('pickBtn');
  const resetBtn = document.getElementById('resetBtn');
  const saveBtn = document.getElementById('saveBtn');
  const removeAfterPick = document.getElementById('removeAfterPick');
  const countLabel = document.getElementById('countLabel');
  const poolCount = document.getElementById('poolCount');
  const poolCountText = document.getElementById('poolCountText');
  const syncStatus = document.getElementById('syncStatus');

  let pool = [];        // hozirgi tanlash uchun mavjud ismlar
  let fullList = [];    // original ro'yxat (reset uchun)
  let spinning = false;
  let currentUser = null;

  // ---------- AUTH GUARD ----------
  requireAuth(async (user) => {
    currentUser = user;
    gate.style.display = 'none';
    appWrap.style.display = 'block';
    await loadStudentsFromFirestore();
  }, "../login.html");

  logoutBtn.addEventListener('click', () => logout("../login.html"));

  // ---------- FIRESTORE ----------
  function studentsCollection(){
    // teachers/{uid}/students — har bir o'qituvchi faqat shu yerni ko'radi (Security Rules)
    return collection(db, "teachers", currentUser.uid, "students");
  }

  async function loadStudentsFromFirestore(){
    syncStatus.textContent = "Yuklanmoqda...";
    try {
      const q = query(studentsCollection(), orderBy("createdAt"));
      const snapshot = await getDocs(q);
      const names = [];
      snapshot.forEach(docSnap => names.push(docSnap.data().name));
      namesInput.value = names.join('\n');
      syncFromTextarea();
      syncStatus.textContent = names.length ? `${names.length} ta ism yuklandi` : "";
      syncStatus.className = "sync-status";
    } catch (err) {
      syncStatus.textContent = "Yuklashda xatolik: " + err.message;
      syncStatus.className = "sync-status error";
    }
  }

  async function saveStudentsToFirestore(){
    saveBtn.disabled = true;
    syncStatus.textContent = "Saqlanmoqda...";
    syncStatus.className = "sync-status";
    try {
      // Oddiy strategiya: eskilarini o'chirib, joriy ro'yxatni qayta yozamiz.
      // Kichik ro'yxatlar (bir sinf) uchun bu yetarli va tushunish oson.
      const snapshot = await getDocs(studentsCollection());
      const deletions = [];
      snapshot.forEach(docSnap => {
        deletions.push(deleteDoc(doc(db, "teachers", currentUser.uid, "students", docSnap.id)));
      });
      await Promise.all(deletions);

      const names = parseNames();
      const additions = names.map(name =>
        addDoc(studentsCollection(), { name, createdAt: serverTimestamp() })
      );
      await Promise.all(additions);

      syncStatus.textContent = "Saqlandi ✓";
      syncStatus.className = "sync-status saved";
    } catch (err) {
      syncStatus.textContent = "Saqlashda xatolik: " + err.message;
      syncStatus.className = "sync-status error";
    } finally {
      saveBtn.disabled = false;
    }
  }

  saveBtn.addEventListener('click', saveStudentsToFirestore);

  // ---------- RANDOM TANLASH LOGIKASI ----------
  function parseNames(){
    return namesInput.value
      .split('\n')
      .map(n => n.trim())
      .filter(n => n.length > 0);
  }

  function syncFromTextarea(){
    fullList = parseNames();
    pool = [...fullList];
    updateCount();
  }

  function updateCount(){
    countLabel.textContent = fullList.length + ' ta ism';
    if(removeAfterPick.checked && fullList.length > 0){
      poolCount.style.display = 'flex';
      poolCountText.textContent = pool.length + ' / ' + fullList.length + ' hali tanlanmagan';
    } else {
      poolCount.style.display = 'none';
    }
  }

  namesInput.addEventListener('input', syncFromTextarea);
  removeAfterPick.addEventListener('change', updateCount);

  function pickRandom(){
    if(spinning) return;

    const source = removeAfterPick.checked ? pool : fullList;

    if(source.length === 0){
      stageEmpty.style.display = 'block';
      stageEmpty.textContent = fullList.length === 0
        ? "Avval ism kiriting!"
        : "Hammasi tanlandi! Qayta yuklang.";
      stage.innerHTML = '';
      stage.appendChild(stageEmpty);
      return;
    }

    spinning = true;
    pickBtn.disabled = true;
    stage.classList.remove('winner');

    let spins = 0;
    const totalSpins = 18 + Math.floor(Math.random() * 6);
    const nameEl = document.createElement('div');
    nameEl.className = 'stage-name';
    stage.innerHTML = '';
    stage.appendChild(nameEl);

    const interval = setInterval(() => {
      const randomIndex = Math.floor(Math.random() * source.length);
      nameEl.textContent = source[randomIndex];
      spins++;

      if(spins >= totalSpins){
        clearInterval(interval);

        const finalIndex = Math.floor(Math.random() * source.length);
        const winner = source[finalIndex];
        nameEl.textContent = winner;
        stage.classList.add('winner');

        if(removeAfterPick.checked){
          pool.splice(finalIndex, 1);
        }
        updateCount();

        spinning = false;
        pickBtn.disabled = false;
      }
    }, 60 + spins * 4);
  }

  function resetPool(){
    pool = [...fullList];
    stage.innerHTML = '';
    stageEmpty.style.display = 'block';
    stageEmpty.textContent = "Ismlarni kiriting va \"Tanla\" bosing";
    stage.appendChild(stageEmpty);
    stage.classList.remove('winner');
    updateCount();
  }

  pickBtn.addEventListener('click', pickRandom);
  resetBtn.addEventListener('click', resetPool);
</script>

</body>
</html>
