<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — 35MaktabTools</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#14172B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<style>
  /* Login-ga xos qo'shimcha stillar — theme.css umumiyini to'ldiradi, takrorlamaydi */
  body{ display:flex; align-items:center; justify-content:center; padding: 24px; }
  .wrap{ display:block; max-width: 380px; }
  .mode-switch{
    display:flex; background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px; margin-bottom: 20px;
  }
  .mode-btn{
    flex:1; text-align:center; padding: 9px 0; border-radius: 9px;
    font-family:'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700;
    color: var(--text-dim); cursor:pointer; user-select:none;
  }
  .mode-btn.active{ background: var(--card); color: var(--text); }
  label{ display:block; font-size: 12px; color: var(--text-dim); margin: 14px 0 6px 0; }
  button.submit{ width:100%; margin-top: 20px; background: var(--gold); color: #14172B; }
  button.submit:disabled{ opacity: 0.5; cursor:not-allowed; }
  .error-box{
    margin-top: 14px; padding: 11px 13px; border-radius: 10px;
    background: rgba(255,107,91,0.12); border: 1px solid var(--coral);
    color: #FFB4A9; font-size: 13px; display:none; line-height:1.5;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">35MaktabTools</div>
  <h1>O'qituvchi <span>kirishi</span></h1>

  <div class="card">
    <div class="mode-switch">
      <div class="mode-btn active" data-mode="signin">Kirish</div>
      <div class="mode-btn" data-mode="signup">Ro'yxatdan o'tish</div>
    </div>

    <form id="authForm">
      <div id="nameField" style="display:none;">
        <label for="name">Ism-familiya</label>
        <input type="text" id="name" placeholder="Aziza Karimova">
      </div>

      <label for="username">Username</label>
      <input type="text" id="username" required placeholder="aziza_teacher" pattern="[a-zA-Z0-9_\.]+" title="Faqat lotin harflari, raqam, _ va . ishlatiladi">

      <label for="password">Parol</label>
      <input type="password" id="password" required placeholder="kamida 6 belgi" minlength="6">

      <button type="submit" class="submit" id="submitBtn">Kirish</button>
      <div class="error-box" id="errorBox"></div>
    </form>
  </div>
</div>

<script type="module" src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
    });
  }
</script>
</body>
</html>
