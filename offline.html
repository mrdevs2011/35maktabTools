<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14172B">
<title>Offline — 35MaktabTools</title>
<style>
  :root{ --bg:#14172B; --gold:#F2B705; --text:#F1EEE4; --dim:#9BA0C4; --card:#20244A; --border:#33386B; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif;
    padding: 24px; text-align: center;
  }
  .card{
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 32px 28px; max-width: 360px; width: 100%;
  }
  h1{ font-size: 22px; margin: 0 0 10px; }
  p{ color: var(--dim); font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
  button{
    width: 100%; border: none; border-radius: 12px; padding: 13px 18px;
    background: var(--gold); color: #14172B; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  button:active{ transform: scale(0.97); }
</style>
</head>
<body>
  <div class="card">
    <h1>Internet yo‘q</h1>
    <p>Hozir offline’siz. Avval ochilgan sahifalar ishlashi mumkin — qayta urinib ko‘ring yoki tarmoqni tekshiring.</p>
    <button type="button" onclick="location.reload()">Qayta urinish</button>
  </div>
</body>
</html>
